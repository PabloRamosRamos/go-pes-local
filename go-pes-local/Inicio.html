<script>
  window.GO_PES_INICIO = (() => {
    /* Paleta categórica validada (dataviz) — se usa vía variables CSS en Styles.html.
       Aquí solo se referencian por nombre de variable para el donut/leyendas. */
    var CHART_VARS = ['--dashx-c1','--dashx-c2','--dashx-c3','--dashx-c4','--dashx-c5'];

    /* ══════════════════════════════════════════ ENTRY POINT ══════════════════════════════════════════ */
    function render(options) {
      var root = options && options.root;
      var esc  = options && options.escapeHtml;
      if (!root || typeof esc !== 'function') return;

      var dashData      = (options && options.dashData)      || {};
      var onDashRefresh = options && options.onDashRefresh;
      var filters   = dashData.filters  || {};

      root.innerHTML = [
        '<div class="inicio-shell">',
          '<div class="section-head inicio-head">',
            '<div>',
              '<p class="eyebrow">Inicio</p><h2>Resumen del Programa</h2>',
              '<p class="muted">Resumen operativo, alertas y dashboard ejecutivo del programa.</p>',
            '</div>',
          '</div>',
          '<div class="inicio-layout">',

            /* ── Panel lateral: alertas operativas + calendario (sin cambios) ── */
            '<aside class="inicio-alerts-panel">',
              '<div id="alertas-panel-root"></div>',
              '<div id="inicio-calendario-root"></div>',
            '</aside>',

            /* ── Panel dashboard (rediseño Alt A) ── */
            '<section class="inicio-dashboard-panel" id="dashx-panel">',
              '<div class="dash-panel-head">',
                '<div><p class="eyebrow">Dashboard</p><h3>Panel ejecutivo del programa</h3></div>',
                '<div class="dash-head-actions">',
                  '<span class="dashx-fresh" id="dash-updated">' + freshLabel_(dashData.lastUpdated, esc) + '</span>',
                  '<button class="btn secondary-btn btn--sm" id="dash-pdf-btn" type="button" title="Descargar PDF (imprimir)">',
                    '<span class="material-symbols-outlined" style="font-size:1rem">picture_as_pdf</span> PDF',
                  '</button>',
                  '<button class="btn secondary-btn btn--sm" id="dash-refresh-btn" type="button">',
                    '<span class="material-symbols-outlined" style="font-size:1rem">refresh</span> Actualizar',
                  '</button>',
                '</div>',
              '</div>',
              buildFilterBar_(filters, esc),
              '<div id="dashx-body">' + buildBody_(dashData, esc) + '</div>',
            '</section>',
          '</div>',
          '<div class="dashx-print-meta" id="dashx-print-meta" aria-hidden="true"></div>',
        '</div>'
      ].join('');

      bindDashboard_(root, esc, onDashRefresh);
    }

    /* ══════════════════════════════════════════ CUERPO ALT A ══════════════════════════════════════════ */
    function buildBody_(d, esc) {
      if (!d || !d.heroKpis) {
        return '<div class="dashx-loading"><span class="material-symbols-outlined dash-spin">refresh</span><span>Cargando indicadores…</span></div>';
      }
      var charts = d.charts || {};
      return [
        buildHero_(d.heroKpis),
        sectionTitle_('Requiere atención'),
        buildAtencion_(d.formalizacion || {}, d.camaras || {}, d.fondese || {}),
        sectionTitle_('Avance y organizaciones'),
        '<div class="dashx-grid2">',
          card_('Avance por hito', '% de organizaciones que cumplió cada hito clave', funnel_(mapAvance_(charts.avancePorHito || []))),
          card_('Organizaciones por estado', 'estado de constitución', donut_(charts.estadosConstitucion || [], esc)),
        '</div>',
        '<div class="dashx-grid2">',
          card_('Organizaciones por UV', 'Top 6 unidades vecinales', barsMag_((charts.porUv || []).slice(0,6))),
          card_('Estados de avance', 'estado vigente por organización', estadosAvance_(d.estadosAvance || {})),
        '</div>',
        sectionTitle_('Beneficios'),
        '<div class="dashx-grid2">',
          card_('FONDESE · postulaciones por estado', montoSub_(d.fondese || {}), funnel_(mapFondese_((d.fondese || {}).embudo || []))),
          card_('CÁMARAS 1414', 'flujo elegible → solicitado → instalado', camaras_(d.camaras || {})),
        '</div>',
        sectionTitle_('Capacitaciones'),
        capacitaciones_(d.capacitaciones || {}, esc)
      ].join('');
    }

    /* ── Hero ── */
    function buildHero_(k) {
      var tiles = [
        tile_('Comités constituidos', fmt_(k.comites), 'de ' + fmt_(k.enGestion + k.comites) + ' orgs · cert. definitivo', 'ok'),
        tile_('En gestión', fmt_(k.enGestion), 'activas sin FOR_04', ''),
        tile_('Próximas asambleas', fmt_(k.proximasAsambleas), 'PRE_03 hecho, falta PRE_04', ''),
        tile_('Casos registrados', fmt_(k.totalCasos), fmt_(k.grupos) + ' grupos sin organización', ''),
        tile_('FONDESE adjudicadas', fmt_(k.fondeseAdjudicadas), money_(k.fondeseMontoAdjudicado) + ' adj · ' + money_(k.fondeseMontoEjecutado) + ' ejec.', '')
      ];
      return '<div class="dashx-hero">' + tiles.join('') + '</div>';
    }
    function tile_(label, value, ctx, tone) {
      var t = tone ? ' dashx-tile--' + tone : '';
      return '<div class="dashx-tile' + t + '"><div class="dashx-tile__k">' + label + '</div><div class="dashx-tile__v">' + value + '</div><div class="dashx-tile__ctx">' + ctx + '</div></div>';
    }

    /* ── Banda de atención (status reservado, icono + etiqueta) ── */
    function buildAtencion_(form, cam, fon) {
      var chips = [
        chip_('ok',      'task_alt',      form.vigentes  || 0, 'Formalización vigente'),
        chip_('warn',    'schedule',      form.porVencer || 0, 'Formalización por vencer'),
        chip_('crit',    'warning',       form.atrasados || 0, 'Formalización atrasada'),
        chip_('serious', 'hourglass_top', cam.fueraPlazo || 0, 'CÁMARAS fuera de plazo'),
        chip_('crit',    'error',         fon.rendicionesPendientes || 0, 'Rendiciones FONDESE pendientes')
      ];
      return '<div class="dashx-status-row">' + chips.join('') + '</div>';
    }
    function chip_(tone, icon, value, label) {
      return '<div class="dashx-chip dashx-chip--' + tone + '"><span class="material-symbols-outlined dashx-chip__i">' + icon + '</span><div><div class="dashx-chip__v">' + fmt_(value) + '</div><div class="dashx-chip__l">' + label + '</div></div></div>';
    }

    /* ── Embudo (barras descendentes, una tonalidad) ── */
    function mapAvance_(rows) {
      return (rows || []).map(function(r) { return { label: r.hito, value: r.pct, suffix: '%', width: Math.min(Math.max(r.pct||0,0),100) }; });
    }
    function mapFondese_(embudo) {
      var max = (embudo || []).reduce(function(m,e){ return Math.max(m, e.count||0); }, 0) || 1;
      return (embudo || []).map(function(e) { return { label: e.label, value: e.count, suffix: '', width: Math.round((e.count||0)/max*100) }; });
    }
    function funnel_(rows) {
      if (!rows || !rows.length) return empty_();
      return '<div class="dashx-funnel">' + rows.map(function(r) {
        return '<div class="dashx-fn-row"><div class="dashx-fn-top"><span>' + r.label + '</span><span class="dashx-fn-n">' + fmt_(r.value) + (r.suffix||'') + '</span></div><div class="dashx-fn-track"><div class="dashx-fn-fill" style="width:' + r.width + '%"></div></div></div>';
      }).join('') + '</div>';
    }

    /* ── Barras de magnitud (una tonalidad teal) ── */
    function barsMag_(rows) {
      if (!rows || !rows.length) return empty_();
      var max = rows.reduce(function(m,r){ return Math.max(m, r.count||0); }, 0) || 1;
      return '<div class="dashx-bars">' + rows.map(function(r) {
        var w = Math.max(Math.round((r.count||0)/max*100), 2);
        return '<div class="dashx-bar-row"><span class="dashx-bar-lbl">' + r.label + '</span><div class="dashx-bar-track"><div class="dashx-bar-fill" style="width:' + w + '%"></div></div><span class="dashx-bar-n">' + fmt_(r.count) + '</span></div>';
      }).join('') + '</div>';
    }

    /* ── Donut (conic-gradient + leyenda con etiquetas directas) ── */
    function donut_(data, esc) {
      var rows = (data || []).filter(function(d){ return (d.count||0) > 0; });
      if (!rows.length) return empty_();
      var total = rows.reduce(function(s,d){ return s + (d.count||0); }, 0);
      var acc = 0, stops = [], legend = [];
      rows.forEach(function(d, i) {
        var pct = (d.count||0)/total*100;
        var v = CHART_VARS[i % CHART_VARS.length];
        stops.push('var(' + v + ') ' + acc.toFixed(2) + '% ' + (acc+pct).toFixed(2) + '%');
        acc += pct;
        legend.push('<div class="dashx-lg-item"><span class="dashx-lg-sw" style="background:var(' + v + ')"></span><span class="dashx-lg-nm">' + esc(String(d.label||'')) + '</span><span class="dashx-lg-ct">' + fmt_(d.count) + '</span></div>');
      });
      return '<div class="dashx-donut-wrap"><div class="dashx-donut" style="background:conic-gradient(' + stops.join(',') + ')"><div class="dashx-donut__c"><b>' + fmt_(total) + '</b><span>orgs</span></div></div><div class="dashx-legend">' + legend.join('') + '</div></div>';
    }

    /* ── Estados de avance (chips de status) ── */
    function estadosAvance_(e) {
      var items = [
        ['ok',      'play_arrow', 'Activo',     e['Activo']     || 0],
        ['warn',    'pause',      'Stand by',   e['Stand by']   || 0],
        ['crit',    'stop',       'Detenido',   e['Detenido']   || 0],
        ['neutral', 'check',      'Finalizado', e['Finalizado'] || 0]
      ];
      return '<div class="dashx-status-row">' + items.map(function(it) {
        return chip_(it[0], it[1], it[3], it[2]);
      }).join('') + '</div>';
    }

    /* ── CÁMARAS ── */
    function camaras_(c) {
      var flow = [
        { label: 'Elegible',   value: c.elegible   || 0, suffix: '', width: 100 },
        { label: 'Solicitado', value: c.solicitado || 0, suffix: '', width: pctOf_(c.solicitado, c.elegible) },
        { label: 'Instalado',  value: c.instalado  || 0, suffix: '', width: pctOf_(c.instalado, c.elegible) }
      ];
      return funnel_(flow) +
        '<div class="dashx-status-row" style="margin-top:.75rem">' +
          chip_('neutral', 'videocam', c.camarasInstaladas || 0, 'Cámaras instaladas') +
          chip_('serious', 'hourglass_top', c.fueraPlazo || 0, 'Fuera de plazo') +
        '</div>';
    }
    function pctOf_(n, base) { base = base || 0; return base > 0 ? Math.round((n||0)/base*100) : 0; }

    /* ── Capacitaciones ── */
    function capacitaciones_(c, esc) {
      var tiles = '<div class="dashx-grid3">' + [
        tile_('Eventos', fmt_(c.eventos || 0), tipoResumen_(c.porTipo || [], esc), ''),
        tile_('Inscripciones', fmt_(c.inscripciones || 0), 'no canceladas', ''),
        tile_('Personas capacitadas', fmt_(c.personasUnicas || 0), 'RUT únicos · ' + fmt_(c.ocupacionPct || 0) + '% ocupación', '')
      ].join('') + '</div>';
      var bars = (c.porTipo && c.porTipo.length)
        ? card_('Eventos por tipo', 'categoría de formación', barsMag_(c.porTipo))
        : '';
      return tiles + (bars ? '<div style="margin-top:1rem">' + bars + '</div>' : '');
    }
    function tipoResumen_(list, esc) {
      return (list || []).map(function(t){ return esc(String(t.label)) + ' ' + t.count; }).join(' · ') || 'sin eventos';
    }

    /* ══════════════════════════════════════════ FILTROS + BIND ══════════════════════════════════════════ */
    function buildFilterBar_(filters, esc) {
      var uvs   = Array.isArray(filters.uvs)   ? filters.uvs   : [];
      var tipos = Array.isArray(filters.tipos) ? filters.tipos : [];
      var years = Array.isArray(filters.years) ? filters.years : [];
      var af    = filters.activeFilters || {};
      var ESTADOS = ['','Constituida','En proceso','Iniciando','Inactiva','Suspendida'];

      function sel_(id, label, items, selected, emptyLbl) {
        return [
          '<div class="dash-filter-item"><label for="' + id + '">' + label + '</label>',
            '<select class="dash-filter-select" id="' + id + '">',
              '<option value="">' + esc(emptyLbl) + '</option>',
              items.map(function(v){ return '<option value="' + esc(String(v)) + '"' + (String(v) === String(selected||'') ? ' selected':'') + '>' + esc(String(v)) + '</option>'; }).join(''),
            '</select></div>'
        ].join('');
      }
      return [
        '<div class="dash-filters"><div class="dash-filters__row">',
          sel_('dash-filter-uv', 'UV', uvs, af.uv, 'Todas las UV'),
          '<div class="dash-filter-item"><label for="dash-filter-estado">Estado comité</label>',
            '<select class="dash-filter-select" id="dash-filter-estado">',
              ESTADOS.map(function(v){ return '<option value="' + esc(v) + '"' + (v===(af.estado_constitucion||'')?' selected':'') + '>' + esc(v||'Todos') + '</option>'; }).join(''),
            '</select></div>',
          sel_('dash-filter-tipo', 'Tipo organización', tipos, af.tipo_organizacion, 'Todos'),
          sel_('dash-filter-year', 'Período (año)', years, af.year, 'Todos los años'),
        '</div></div>'
      ].join('');
    }

    function bindDashboard_(root, esc, onDashRefresh) {
      var refreshBtn = root.querySelector('#dash-refresh-btn');
      var pdfBtn = root.querySelector('#dash-pdf-btn');

      if (pdfBtn) pdfBtn.addEventListener('click', function() { printDashboard_(root, esc); });

      if (typeof onDashRefresh !== 'function') return;

      function getFilters_() {
        function v_(id){ return ((root.querySelector(id)||{}).value)||''; }
        return {
          uv:                  v_('#dash-filter-uv'),
          estado_constitucion: v_('#dash-filter-estado'),
          tipo_organizacion:   v_('#dash-filter-tipo'),
          year:                parseInt(v_('#dash-filter-year')||'0', 10)
        };
      }
      function setLoading_(on) {
        if (refreshBtn) refreshBtn.disabled = on;
        var body = root.querySelector('#dashx-body');
        if (on && body) body.innerHTML = '<div class="dashx-loading"><span class="material-symbols-outlined dash-spin">refresh</span><span>Actualizando…</span></div>';
      }
      function applyData_(data) {
        var body = root.querySelector('#dashx-body');
        var u = root.querySelector('#dash-updated');
        if (body) body.innerHTML = buildBody_(data, esc);
        if (u) u.innerHTML = freshLabel_(data.lastUpdated, esc);
        if (data.filters) updateFilterOptions_(root, data.filters, esc);
      }
      function runRefresh_() {
        setLoading_(true);
        onDashRefresh(getFilters_(), function(data, err) {
          if (refreshBtn) refreshBtn.disabled = false;
          if (err || !data) {
            var body = root.querySelector('#dashx-body');
            if (body) body.innerHTML = '<div class="dashx-loading"><span class="material-symbols-outlined">error</span><span>Error al cargar datos</span></div>';
            return;
          }
          applyData_(data);
        });
      }
      if (refreshBtn) refreshBtn.addEventListener('click', runRefresh_);
      ['#dash-filter-uv','#dash-filter-estado','#dash-filter-tipo','#dash-filter-year'].forEach(function(sel){
        var el = root.querySelector(sel);
        if (el) el.addEventListener('change', runRefresh_);
      });
    }

    function updateFilterOptions_(root, filters, esc) {
      var uvs   = Array.isArray(filters.uvs)   ? filters.uvs   : [];
      var tipos = Array.isArray(filters.tipos) ? filters.tipos : [];
      var years = Array.isArray(filters.years) ? filters.years : [];
      function rebuild_(id, items, emptyLbl) {
        var el = root.querySelector(id);
        if (!el) return;
        var cur = el.value;
        el.innerHTML = '<option value="">' + esc(emptyLbl) + '</option>' +
          items.map(function(v){ return '<option value="'+esc(String(v))+'">'+esc(String(v))+'</option>'; }).join('');
        el.value = cur;
      }
      rebuild_('#dash-filter-uv', uvs, 'Todas las UV');
      rebuild_('#dash-filter-tipo', tipos, 'Todos');
      rebuild_('#dash-filter-year', years, 'Todos los años');
    }

    /* ══════════════════════════════════════════ PDF (imprimir navegador, fiel a los gráficos) ══════════════════════════════════════════ */
    function printDashboard_(root, esc) {
      var meta = root.querySelector('#dashx-print-meta');
      if (meta) {
        var now = new Date();
        var f = function(n){ return (n < 10 ? '0' : '') + n; };
        var stamp = f(now.getDate()) + '-' + f(now.getMonth()+1) + '-' + now.getFullYear() + ' ' + f(now.getHours()) + ':' + f(now.getMinutes());
        var upd = (root.querySelector('#dash-updated') || {}).textContent || '';
        meta.innerHTML = '<div class="dashx-print-title">GO-PES · Dashboard del Programa Estamos Seguros</div>' +
          '<div class="dashx-print-sub">Impreso: ' + esc(stamp) + (upd ? ' · ' + esc(upd) : '') + '</div>';
      }
      document.body.classList.add('dashx-printing');
      var cleanup = function(){ document.body.classList.remove('dashx-printing'); window.removeEventListener('afterprint', cleanup); };
      window.addEventListener('afterprint', cleanup);
      setTimeout(function(){ window.print(); }, 60);
    }

    /* ══════════════════════════════════════════ HELPERS ══════════════════════════════════════════ */
    function sectionTitle_(t) { return '<div class="dashx-section-t">' + t + '</div>'; }
    function card_(title, sub, content) {
      return '<div class="dashx-card"><h4 class="dashx-card__h">' + title + '</h4>' + (sub ? '<p class="dashx-card__s">' + sub + '</p>' : '') + '<div class="dashx-card__b">' + content + '</div></div>';
    }
    function montoSub_(f) { return money_(f.montoAdjudicado || 0) + ' adj · ' + money_(f.montoEjecutado || 0) + ' ejec · ' + fmt_(f.adjudicadas || 0) + ' adjudicadas'; }
    function empty_() { return '<div class="dashx-empty"><span class="material-symbols-outlined">bar_chart</span><p>Sin datos suficientes</p></div>'; }
    function fmt_(n) { return typeof n === 'number' ? n.toLocaleString('es-CL') : (n || '—'); }
    function money_(n) { n = Number(n||0)||0; return '$' + n.toLocaleString('es-CL'); }
    function freshLabel_(lastUpdated, esc) {
      return lastUpdated ? '<span class="dashx-fresh__dot"></span>Actualizado ' + esc(String(lastUpdated)) : '';
    }

    return { render };
  })();
</script>
